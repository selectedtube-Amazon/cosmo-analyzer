<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亚马逊 Listing 智能优化系统</title>
<style>
    :root{--primary:#2563eb;--primary-dark:#1d4ed8;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--a9:#8b5cf6;--gemini:#ea580c;--bg:#f1f5f9;--card:#fff;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;}
    *{box-sizing:border-box;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.55;margin:0;padding:16px;}
    .container{max-width:1560px;margin:0 auto;}
    header{text-align:center;margin-bottom:14px;}
    header h1{margin:0;font-size:20px;color:#334155;}
    .card{background:var(--card);border-radius:14px;box-shadow:0 4px 6px -1px rgba(15,23,42,.08);padding:24px;margin-bottom:18px;border:1px solid rgba(226,232,240,.8);}
    .card h2{margin:0 0 16px;font-size:17px;}
    .form-group{margin-bottom:15px;display:flex;flex-direction:column;}
    label{display:block;font-weight:600;margin-bottom:6px;font-size:13px;color:#334155;}
    input[type="text"],input[type="number"],input[type="password"],textarea{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font-size:14px;font-family:inherit;color:var(--text);background:#fff;}
    input[type="text"]:focus,input[type="number"]:focus,input[type="password"]:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
    textarea{resize:vertical;height:90px;}
    .input-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:20px;}
    .input-layout-left{display:flex;flex-direction:column;height:100%;}
    .input-layout-right{display:flex;flex-direction:column;}
    @media (max-width:900px){.input-layout{grid-template-columns:1fr;}}
    .keywords-box{background:#fffbeb;padding:16px;border-radius:10px;border:1px dashed #f59e0b;display:flex;flex-direction:column;flex-grow:1;}
    .keywords-box .hint{font-size:12px;color:#92400e;margin-top:6px;}
    .keywords-box label{color:#92400e;margin-bottom:8px;}
    .keywords-box textarea{background:#fffbeb;border-color:#fde68a;flex-grow:1;min-height:200px;resize:none;}
    .btn-sm{background:#0f172a;color:#fff;border:none;padding:0 18px;height:32px;font-size:12px;font-weight:600;border-radius:9px;cursor:pointer;font-family:inherit;}
    .btn-sm:hover{background:#334155;}
    .btn-sm.gray{background:#64748b;} .btn-sm.gray:hover{background:#475569;}
    .btn-sm.red{background:#dc2626;} .btn-sm.red:hover{background:#b91c1c;}
    .btn-sm.green{background:#059669;} .btn-sm.green:hover{background:#047857;}
    .btn-sm.orange{background:#ea580c;} .btn-sm.orange:hover{background:#c2410c;}
    .btn-sm.blue{background:#2563eb;} .btn-sm.blue:hover{background:#1d4ed8;}
    .btn-row{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;}
    button.btn{background:var(--gemini);color:#fff;border:none;padding:13px 24px;font-size:15px;font-weight:600;border-radius:9px;cursor:pointer;flex:1;font-family:inherit;}
    button.btn:hover{background:#c2410c;}
    button.btn:disabled{background:#94a3b8;cursor:not-allowed;}
    button.btn.ghost{flex:0 0 auto;background:#fff;color:#475569;border:1px solid #cbd5e1;padding:13px 20px;}
    button.btn.ghost:hover{background:#f1f5f9;}
    .constraint-card{background:linear-gradient(135deg,#f0f9ff 0%,#f0fdf4 100%);border:1px solid #bae6fd;}
    .constraint-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none;}
    .constraint-header h2{margin:0;font-size:16px;color:#0369a1;}
    .constraint-header .toggle-hint{font-size:12px;color:#0369a1;font-weight:600;}
    .constraint-body{margin-top:18px;padding-top:16px;border-top:1px dashed #bae6fd;}
    .constraint-section{margin-bottom:22px;}
    .constraint-section .sec-title{font-size:13px;font-weight:700;color:#075985;margin-bottom:10px;}
    .num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
    .num-grid .num-item label{font-size:12px;color:#334155;}
    .num-grid .num-item input[type="number"]{padding:8px 10px;font-size:13px;}
    .rule-item{margin-bottom:14px;}
    .rule-item label{font-size:12.5px;color:#075985;font-weight:700;}
    .rule-item textarea{font-size:12.5px;line-height:1.6;background:#fff;border-color:#bae6fd;min-height:80px;font-family:ui-monospace,Menlo,Consolas,monospace;}
    .forbidden-ta{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#fff;border-color:#bae6fd;min-height:120px;}
    .example-ta{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#fff;border-color:#bae6fd;min-height:280px;line-height:1.65;}
    .constraint-footer{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:14px;border-top:1px dashed #bae6fd;flex-wrap:wrap;gap:10px;}
    .constraint-footer .status{font-size:12px;color:#0369a1;font-weight:600;}
    .apikey-card{background:linear-gradient(135deg,#fff7ed 0%,#ffedd5 100%);border:1px solid #fed7aa;}
    .apikey-card h2{margin:0 0 10px;font-size:16px;color:#9a3412;}
    .apikey-card .key-hint{font-size:12px;color:#c2410c;margin-bottom:12px;line-height:1.5;}
    .apikey-card input[type="password"]{background:#fff;border-color:#fed7aa;font-family:monospace;}
    .apikey-card input[type="password"]:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,.12);}

    .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:26px;}
    @media (max-width:1100px){.compare-grid{grid-template-columns:1fr;}}
    .pane{border-radius:12px;padding:18px;border:1px solid;}
    .pane-left{background:#f8fafc;border-color:#e2e8f0;}
    .pane-right{background:#fffbf5;border-color:#fed7aa;}
    .pane h3{margin:0 0 14px;font-size:15px;padding-bottom:9px;border-bottom:2px solid;}
    .pane-left h3{color:#334155;border-color:#cbd5e1;}
    .pane-right h3{color:#c2410c;border-color:#fdba74;}
    .results-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;border-bottom:2px solid var(--border);padding-bottom:16px;margin-bottom:20px;flex-wrap:wrap;}
    .results-header h2{margin:0 0 6px;font-size:19px;}
    #targetUrlDisplay{margin:0;color:var(--muted);font-size:12.5px;}
    .score-section{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
    .score-card{border-radius:12px;padding:12px 16px;border:1px solid;min-width:280px;}
    .score-card.cosmo{background:#eff6ff;border-color:#bfdbfe;}
    .score-card.a9{background:#f5f3ff;border-color:#c4b5fd;}
    .score-card .sc-ttl{font-size:11.5px;font-weight:700;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .score-card.cosmo .sc-ttl{color:#1d4ed8;}
    .score-card.a9 .sc-ttl{color:#6d28d9;}
    .score-pair{display:flex;gap:12px;align-items:center;}
    .score-item{text-align:center;}
    .score-item .score-label{font-size:10.5px;color:var(--muted);margin-bottom:3px;font-weight:600;}
    .score-badge{display:inline-block;font-size:20px;font-weight:800;padding:5px 12px;border-radius:9px;background:#fff;color:var(--primary);white-space:nowrap;border:1px solid #e2e8f0;}
    .score-card.cosmo .score-badge{color:#1d4ed8;border-color:#bfdbfe;}
    .score-card.a9 .score-badge{color:#6d28d9;border-color:#c4b5fd;}
    .score-badge.lv-a{background:#ecfdf5;color:#047857;border-color:#a7f3d0 !important;}
    .score-badge.lv-b{background:#eff6ff;color:#1d4ed8;border-color:#bfdbfe !important;}
    .score-badge.lv-c{background:#fffbeb;color:#b45309;border-color:#fde68a !important;}
    .score-badge.lv-d{background:#fef2f2;color:#b91c1c;border-color:#fecaca !important;}
    .score-arrow{font-size:18px;color:#94a3b8;font-weight:700;}
    .score-improve{font-size:11px;font-weight:700;margin-top:6px;min-height:16px;}
    .score-card.cosmo .score-improve{color:#047857;}
    .score-card.a9 .score-improve{color:#6d28d9;}
    .stat-row{display:flex;flex-direction:column;gap:10px;margin-bottom:16px;}
    .stat-line{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
    .stat-line .line-label{font-size:12px;font-weight:700;color:var(--muted);min-width:56px;}
    .stat{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:99px;border:1px solid;}
    .stat.g{background:#ecfdf5;color:#047857;border-color:#a7f3d0;}
    .stat.y{background:#fffbeb;color:#b45309;border-color:#fde68a;}
    .stat.r{background:#fef2f2;color:#b91c1c;border-color:#fecaca;}
    .ai-status{font-size:12.5px;padding:5px 12px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-weight:600;}
    .ai-status.loading{background:#fef3c7;color:#b45309;animation:pulse 1.4s infinite;}
    .ai-status.done{background:#ecfdf5;color:#047857;}
    .ai-status.error{background:#fef2f2;color:#b91c1c;}
    @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
    .pipeline-progress{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
    .pipeline-step{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:#f1f5f9;color:#94a3b8;border:1px solid #e2e8f0;transition:all .3s;}
    .pipeline-step.active{background:#fef3c7;color:#b45309;border-color:#fde68a;animation:pulse 1.4s infinite;}
    .pipeline-step.done{background:#ecfdf5;color:#047857;border-color:#a7f3d0;}
    .pipeline-step.error{background:#fef2f2;color:#b91c1c;border-color:#fecaca;}
    .table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:20px;}
    table{width:100%;border-collapse:collapse;font-size:13px;min-width:880px;}
    th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top;}
    th{background:#f8fafc;font-weight:700;font-size:12.5px;color:#475569;}
    tbody tr:hover{background:#fafbfc;}
    .cluster-tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:#eef2ff;color:#4338ca;white-space:nowrap;}
    .cluster-tag.a9{background:#f5f3ff;color:#6d28d9;}
    .anchor-name{font-family:monospace;font-size:12.5px;color:#0f172a;font-weight:600;display:block;}
    .anchor-cn{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-weight:400;}
    .status-green{color:var(--success);font-weight:700;white-space:nowrap;}
    .status-yellow{color:var(--warning);font-weight:700;white-space:nowrap;}
    .status-red{color:var(--danger);font-weight:700;white-space:nowrap;}
    .score-mini{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:3px;}
    .kw-chip{display:inline-block;font-size:11px;font-family:monospace;padding:2px 7px;border-radius:5px;margin:2px 4px 2px 0;border:1px solid;}
    .kw-chip.hit{background:#ecfdf5;color:#047857;border-color:#a7f3d0;}
    .kw-chip.miss{background:#f8fafc;color:#94a3b8;border-color:#e2e8f0;}
    .copy-section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;padding-bottom:6px;border-bottom:1px solid #d1fae5;flex-wrap:wrap;gap:8px;}
    .copy-section-header span{font-weight:700;font-size:12.5px;color:#15803d;flex:1;}
    .copy-section-header .header-actions{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;}
    .custom-req-input{border:1px solid #a7f3d0;border-radius:6px;padding:4px 8px;font-size:11.5px;width:200px;background:#fff;color:#166534;}
    .custom-req-input::placeholder{color:#86efac;font-style:italic;}
    .copy-btn{background:var(--success);color:#fff;border:none;padding:5px 13px;font-size:11.5px;font-weight:700;border-radius:6px;cursor:pointer;font-family:inherit;white-space:nowrap;}
    .copy-btn:hover{background:#059669;}
    .optimized-textarea{width:100%;background:#fff;border:1px solid #bbf7d0;border-radius:9px;padding:11px;font-size:13px;line-height:1.6;color:#0f172a;margin-bottom:15px;resize:vertical;font-family:inherit;}
    .optimized-textarea:focus{outline:none;border-color:var(--success);}
    .optimized-textarea.undersized{border-color:#fde68a;background:#fffbeb;}
    .byte-counter{font-size:11.5px;color:var(--muted);margin-top:-10px;margin-bottom:12px;text-align:right;}
    .byte-counter.over{color:var(--danger);font-weight:700;}
    .byte-counter.under{color:var(--warning);font-weight:700;}
    .bp-item{border:1px solid #bbf7d0;border-radius:10px;padding:14px;margin-bottom:16px;background:#f0fdf4;}
    .bp-item.undersized{border-color:#fde68a;background:#fffbeb;}
    .bp-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #d1fae5;flex-wrap:wrap;gap:8px;}
    .bp-item-header .bp-label{font-weight:700;font-size:12.5px;color:#15803d;}
    .bp-item-header .bp-role{font-size:11px;color:#166534;font-weight:600;background:#dcfce7;padding:2px 8px;border-radius:4px;margin-left:8px;}
    .bp-item-header .bp-role.spec{background:#dbeafe;color:#1e40af;}
    .bp-item textarea{width:100%;background:#fff;border:1px solid #bbf7d0;border-radius:8px;padding:10px;font-size:13px;line-height:1.6;color:#0f172a;resize:vertical;min-height:70px;font-family:inherit;}
    .bp-item textarea:focus{outline:none;border-color:var(--success);}
    .validation-report{margin-top:20px;padding:16px 18px;border-radius:10px;background:#f0f9ff;border:1px solid #bae6fd;border-left:4px solid #0ea5e9;}
    .validation-report.has-errors{background:#fffbeb;border-color:#fde68a;border-left-color:#f59e0b;}
    .validation-report .report-ttl{font-size:13px;font-weight:700;color:#0369a1;margin-bottom:10px;}
    .validation-report.has-errors .report-ttl{color:#b45309;}
    .validation-report .issue-row{font-size:12.5px;color:#334155;padding:6px 0;border-bottom:1px dashed #e2e8f0;}
    .validation-report .issue-row:last-child{border-bottom:none;}
    .validation-report .issue-row .module-tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;background:#dbeafe;color:#1e40af;margin-right:6px;}
    .validation-report .issue-row.error .module-tag{background:#fee2e2;color:#991b1b;}
    .validation-report .issue-row.warn .module-tag{background:#fef3c7;color:#92400e;}
    .expand-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
    .expand-bar .expand-msg{font-size:12.5px;color:#92400e;font-weight:600;}
    .hidden{display:none;}
    .fade-in{animation:fadeIn .45s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
    #toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);background:#0f172a;color:#fff;padding:11px 22px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
    #toast.show{opacity:1;transform:translate(-50%,0);}

    .wash-card{background:linear-gradient(135deg,#faf5ff 0%,#f5f3ff 100%);border:1px solid #ddd6fe;padding:14px 18px;margin-bottom:16px;}
    .wash-card .wash-title{font-size:14px;font-weight:700;color:#6d28d9;margin:0 0 10px;}
    .wash-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
    .wash-drop{flex:1;min-width:280px;border:2px dashed #c4b5fd;border-radius:10px;padding:14px 16px;text-align:center;background:#fff;cursor:pointer;transition:.2s;display:flex;flex-direction:column;justify-content:center;align-self:stretch;}
    .wash-drop:hover,.wash-drop.dragover{background:#f5f3ff;border-color:#8b5cf6;}
    .wash-drop .wd-ttl{font-size:13px;font-weight:700;color:#6d28d9;margin-bottom:2px;}
    .wash-drop .wd-hint{font-size:11px;color:#7c3aed;line-height:1.5;}
    .wash-grid{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;max-width:60%;}
    .wash-thumb{position:relative;border:1px solid #ddd6fe;border-radius:8px;overflow:hidden;background:#fff;transition:.2s;cursor:grab;width:100px;height:100px;flex-shrink:0;}
    .wash-thumb:hover{box-shadow:0 3px 10px rgba(139,92,246,.2);}
    .wash-thumb:active{cursor:grabbing;}
    .wash-thumb.dragging{opacity:.4;}
    .wash-thumb.drag-over{border-color:#8b5cf6;border-width:2px;background:#f5f3ff;}
    .wash-thumb img{width:100%;height:100%;display:block;object-fit:cover;background:#fafafa;pointer-events:none;}
    .wash-thumb .wt-role{position:absolute;top:3px;left:3px;font-size:10px;padding:2px 6px;border-radius:4px;font-weight:700;color:#fff;line-height:1.2;}
    .wash-thumb .wt-role.main{background:#dc2626;}
    .wash-thumb .wt-role.sub{background:#2563eb;}
    .wash-thumb .wt-status{position:absolute;top:3px;right:3px;font-size:10px;padding:2px 5px;border-radius:4px;background:#fff;font-weight:700;line-height:1.2;}
    .wash-thumb .wt-status.wait{color:#94a3b8;}
    .wash-thumb .wt-status.doing{color:#b45309;background:#fef3c7;}
    .wash-thumb .wt-status.done{color:#047857;background:#ecfdf5;}
    .wash-thumb .wt-status.err{color:#b91c1c;background:#fef2f2;}
    .wash-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start;flex-shrink:0;}
    .wash-progress{margin:10px 0 0;height:6px;background:#ede9fe;border-radius:99px;overflow:hidden;}
    .wash-progress .wp-bar{height:100%;width:0;background:linear-gradient(90deg,#8b5cf6,#a78bfa);transition:width .3s;}
    .wash-progress-text{font-size:11.5px;color:#6d28d9;font-weight:600;text-align:center;margin-top:4px;}

    .export-box{background:linear-gradient(135deg,#f0fdf4 0%,#ecfdf5 100%);border:1px solid #a7f3d0;border-radius:12px;padding:16px 18px;margin-top:8px;}
    .export-box .eb-title{font-size:15px;font-weight:700;color:#065f46;margin:0 0 4px;}
    .export-box .eb-sub{font-size:12px;color:#047857;margin-bottom:14px;}
    .export-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px;margin-bottom:12px;}
    .ef-item{display:flex;flex-direction:column;gap:4px;}
    .ef-item label{font-size:11.5px;font-weight:700;color:#065f46;}
    .ef-item input,.ef-item select{padding:7px 10px;font-size:13px;border:1px solid #a7f3d0;border-radius:7px;background:#fff;font-family:inherit;color:#0f172a;}
    .ef-item input:focus,.ef-item select:focus{outline:none;border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.12);}
    .ef-full{grid-column:1/-1;}
    .export-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;align-items:center;}
    .export-actions .queue-info{font-size:12px;font-weight:700;color:#065f46;margin-left:auto;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
