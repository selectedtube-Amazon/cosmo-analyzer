<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>亚马逊 COSMO 15 锚点 + A9 双算法智能打分系统</title>
<style>
    :root{
        --primary:#2563eb; --primary-dark:#1d4ed8;
        --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
        --a9:#8b5cf6; --a9-dark:#6d28d9;
        --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
    }
    *{box-sizing:border-box;}
    body{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
        background:var(--bg); color:var(--text); line-height:1.55; margin:0; padding:24px 16px;
        -webkit-font-smoothing:antialiased;
    }
    .container{max-width:1560px;margin:0 auto;}
    header{text-align:center;margin-bottom:26px;}
    header h1{margin:0 0 8px;font-size:26px;color:#0f172a;letter-spacing:-.3px;}
    header p{color:var(--muted);margin:0;font-size:14px;}
    .card{
        background:var(--card);border-radius:14px;
        box-shadow:0 4px 6px -1px rgba(15,23,42,.08),0 2px 4px -2px rgba(15,23,42,.05);
        padding:24px;margin-bottom:22px;border:1px solid rgba(226,232,240,.8);
    }
    .card h2{margin:0 0 16px;font-size:17px;}
    .form-group{margin-bottom:15px; display:flex; flex-direction:column;}
    label{display:block;font-weight:600;margin-bottom:6px;font-size:13px;color:#334155;}
    input[type="text"],textarea{
        width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;
        font-size:14px;font-family:inherit;color:var(--text);background:#fff;
        transition:border-color .15s, box-shadow .15s;
    }
    input[type="text"]:focus,textarea:focus{
        outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12);
    }
    textarea{resize:vertical;height:90px;}
    /* 输入区双栏布局 */
    .input-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 24px;
        margin-bottom: 20px;
    }
    .input-layout-left {
        display: flex;
        flex-direction: column;
        height: 100%;
    }
    .input-layout-right {
        display: flex;
        flex-direction: column;
    }
    @media (max-width: 900px) {
        .input-layout { grid-template-columns: 1fr; }
    }
    .keywords-box{background:#fffbeb;padding:16px;border-radius:10px;border:1px dashed #f59e0b; display: flex; flex-direction: column; flex-grow: 1;}
    .keywords-box .hint{font-size:12px;color:#92400e;margin-top:6px;}
    .keywords-box label{color:#92400e;margin-bottom:8px;}
